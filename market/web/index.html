<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eff3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)" />
    <title>Balloon Count Market</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='6' r='5' fill='%23f2b705'/%3E%3Cpath d='M8 11v5' stroke='%2313202e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="live" id="live" data-state="connecting" aria-hidden="true"></span>
        <h1>Count Market</h1>
      </div>
      <div class="wallet" id="wallet" aria-live="polite"></div>
    </header>

    <main>
      <p class="lede">
        A tethered balloon camera counts cars and people below it. Bet play credits on what it will count.
        Each winning share pays 1 credit.
      </p>

      <form class="register" id="register" hidden>
        <label for="name">Pick a name to get 1000 play credits</label>
        <div class="register-row">
          <input id="name" name="name" maxlength="24" autocomplete="nickname" required />
          <button type="submit" class="btn btn-primary">Join</button>
        </div>
      </form>

      <section aria-labelledby="open-heading">
        <h2 id="open-heading">Open markets</h2>
        <div id="open" class="stack"></div>
      </section>

      <section aria-labelledby="resolved-heading">
        <h2 id="resolved-heading">Resolved</h2>
        <div id="resolved" class="stack"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
