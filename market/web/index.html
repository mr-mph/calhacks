<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Bet play credits on what the Overhead balloon camera counts." />
    <title>Overhead Markets</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23e96457'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="./">Overhead<span>.</span></a>
      <nav class="nav topnav" id="topnav" aria-label="Overhead"></nav>
      <div class="wallet" id="wallet" aria-live="polite" hidden></div>
    </header>

    <main>
      <div class="page-head">
        <h1>Markets</h1>
        <p>
          The balloon camera counts cars and people below it. Bet play credits on what it will count.
          Each winning share pays 1 credit.
        </p>
        <p class="status caption"><span class="dot" id="live" data-state="connecting"></span><span id="status-text">Connecting</span></p>
      </div>

      <form class="register" id="register" hidden>
        <label for="name">Pick a name to get 1000 play credits</label>
        <div class="field-row">
          <input class="input" id="name" name="name" maxlength="24" autocomplete="nickname" required />
          <button type="submit" class="btn btn-primary">Join</button>
        </div>
      </form>

      <section aria-labelledby="open-heading">
        <h2 id="open-heading">Open</h2>
        <div id="open" class="grid"></div>
      </section>

      <section aria-labelledby="resolved-heading">
        <h2 id="resolved-heading">Settled</h2>
        <div id="resolved" class="grid"></div>
      </section>
    </main>

    <nav class="nav tabbar" id="tabbar" aria-label="Overhead"></nav>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <form class="sheet-body" id="sheet-form" method="dialog">
        <div class="sheet-head">
          <div>
            <p class="caption" id="sheet-eyebrow"></p>
            <h2 id="sheet-title"></h2>
          </div>
          <button type="button" class="btn btn-quiet btn-icon" id="sheet-close" aria-label="Close"></button>
        </div>
        <div class="toggle" role="group" aria-label="Side">
          <button type="button" data-side="yes" aria-pressed="true"></button>
          <button type="button" data-side="no" aria-pressed="false"></button>
        </div>
        <div class="amount">
          <label for="amount">Amount (credits)</label>
          <input class="input" id="amount" inputmode="decimal" autocomplete="off" value="10" />
          <div class="quick">
            <button type="button" data-add="10">+10</button>
            <button type="button" data-add="50">+50</button>
            <button type="button" data-add="100">+100</button>
          </div>
        </div>
        <dl class="quote" id="quote"></dl>
        <button type="submit" class="btn btn-primary" id="sheet-buy"></button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
